[project]
name = "promptforge-cli"
version = "0.1.0"
description = "Pull PromptForge starter kits and prompts from your terminal."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
promptforge = "promptforge_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["promptforge_cli"]

[tool.ruff]
target-version = "py310"
line-length = 100
